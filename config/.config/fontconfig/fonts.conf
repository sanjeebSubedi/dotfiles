<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Do not let webfont wrappers participate in desktop font matching. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="fontwrapper"><string>WOFF</string></patelt></pattern>
      <pattern><patelt name="fontwrapper"><string>WOFF2</string></patelt></pattern>
    </rejectfont>
  </selectfont>

  <!-- Global rendering defaults: RGB subpixel + slight hinting. Subpixel
       mostly benefits Chrome/Skia (one of the few Wayland apps that still
       honors fontconfig rgba) and XWayland; tried grayscale (Jun 2026) but
       small text in Chrome visibly degraded. Keep gsettings font-antialiasing
       (autostart.lua) and gtk-xft-rgba (gtk-3.0/settings.ini) in sync. -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Disable autohint for fonts with high-quality bundled hints. -->
  <match target="font">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>SF Pro Display</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>Inter</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>Merriweather</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>JetBrains Mono</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>JetBrainsMono Nerd Font Mono</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>BerkeleyMono Nerd Font Mono</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>Geist</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>Geist Mono</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Keep generic family resolution stable despite later system aliases. -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Text</string>
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Text</string>
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Merriweather</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>BerkeleyMono Nerd Font Mono</string>
      <string>JetBrainsMono Nerd Font Mono</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>mono</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>BerkeleyMono Nerd Font Mono</string>
      <string>JetBrainsMono Nerd Font Mono</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>

  <!-- SF Pro optical sizing: Text < 20pt, Display >= 20pt (20pt == 26.667px). -->

  <!-- >= 20pt  ->  SF Pro Display -->
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <test name="pixelsize" compare="more_eq"><double>26.667</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <test name="pixelsize" compare="more_eq"><double>26.667</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Display</string></edit>
  </match>

  <!-- < 20pt  ->  SF Pro Text -->
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Display</string></test>
    <test name="size" compare="less"><double>20</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Display</string></test>
    <test name="pixelsize" compare="less"><double>26.667</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <test name="size" compare="less"><double>20</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <test name="pixelsize" compare="less"><double>26.667</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>

  <!-- This SF Pro packaging declares the Bold faces with usWeightClass 600
       (fontconfig weight 180, the Semibold slot), so bold requests (200)
       snapped to Heavy (205). Fix the weight at cache-scan time. -->
  <match target="scan">
    <test name="family"><string>SF Pro Text</string></test>
    <test name="style"><string>Bold</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>SF Pro Text</string></test>
    <test name="style"><string>Bold Italic</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>SF Pro Display</string></test>
    <test name="style"><string>Bold</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>SF Pro Display</string></test>
    <test name="style"><string>Bold Italic</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Merriweather</family>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>BerkeleyMono Nerd Font Mono</family>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>mono</family>
    <prefer>
      <family>BerkeleyMono Nerd Font Mono</family>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
