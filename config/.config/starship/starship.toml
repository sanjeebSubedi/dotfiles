"$schema" = "https://starship.rs/config-schema.json"

# Minimal two-line prompt, Everforest Dark Hard. No backgrounds or separators.

command_timeout = 2000
add_newline = true
palette = "everforest_dark_hard"

format = """
$directory\
$git_branch\
$git_status\
$python\
$golang\
$rust\
$nodejs\
$cmd_duration\
$line_break\
$character"""

[palettes.everforest_dark_hard]
color_fg     = "#d3c6aa"
color_red    = "#e67e80"
color_green  = "#a7c080"
color_yellow = "#dbbc7f"
color_blue   = "#7fbbb3"
color_orange = "#e69875"
color_grey   = "#859289"

[directory]
style = "bold color_blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "color_red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "color_green"
format = "[$symbol $branch]($style) "

[git_status]
style = "color_red"
format = "[$all_status$ahead_behind]($style)"
ahead = " ${count} "
behind = " ${count} "
diverged = " ${ahead_count}  ${behind_count} "
deleted = " ${count} "
conflicted = "= "
untracked = "? "
stashed = "* "
modified = "! "
staged = "+ "
renamed = "» "

[python]
style = "color_yellow"
format = '[$symbol $version( \($virtualenv\))]($style) '
symbol = ""

[golang]
style = "color_blue"
format = "[$symbol $version]($style) "
symbol = ""

[rust]
style = "color_orange"
format = "[$symbol $version]($style) "
symbol = ""

[nodejs]
style = "color_green"
format = "[$symbol $version]($style) "
symbol = ""

[cmd_duration]
min_time = 500
format = "[took $duration](color_grey) "

[character]
success_symbol = "[❯](bold color_green)"
error_symbol = "[❯](bold color_red)"
vimcmd_symbol = "[❮](bold color_green)"
