font_family      family="BerkeleyMono Nerd Font" style="Regular"
bold_font        family="BerkeleyMono Nerd Font" style="Bold"
italic_font      family="BerkeleyMono Nerd Font" style="Oblique"
bold_italic_font family="BerkeleyMono Nerd Font" style="Bold Oblique"

# No symbol_map: the patched BerkeleyMono Nerd Font carries every icon we use.

font_size        13
disable_ligatures never

window_padding_width 5
background_opacity 0.8

confirm_os_window_close 0
modify_font underline_thickness 40%

touch_scroll_multiplier 3.0

# BEGIN_KITTY_THEME
# Everforest Dark Hard
include current-theme.conf
# END_KITTY_THEME
