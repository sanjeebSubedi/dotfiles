font_family      family="BerkeleyMono Nerd Font" style="Regular"
bold_font        family="BerkeleyMono Nerd Font" style="Bold"
italic_font      family="BerkeleyMono Nerd Font" style="Oblique"
bold_italic_font family="BerkeleyMono Nerd Font" style="Bold Oblique"

symbol_map U+2190-U+21FF JetBrainsMono Nerd Font
symbol_map U+2700-U+27BF Noto Sans Symbols 2
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
# narrow_symbols U+E000-U+F8FF 1

font_size        13

window_padding_width 5
background_opacity 0.8

confirm_os_window_close 0

touch_scroll_multiplier 3.0

# BEGIN_KITTY_THEME
# Everforest Dark Hard
include current-theme.conf
# END_KITTY_THEME
