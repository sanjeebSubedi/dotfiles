general {
    lock_cmd = pidof hyprlock || hyprlock                                                                 # avoid starting multiple hyprlock instances.
    on_unlock_cmd = $HOME/.config/hypr/scripts/idle-brightness.sh restore                                  # restore brightness after unlocking.
    before_sleep_cmd = loginctl lock-session                                                              # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && $HOME/.config/hypr/scripts/idle-brightness.sh restore
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = $HOME/.config/hypr/scripts/idle-brightness.sh dim
    on-resume = $HOME/.config/hypr/scripts/idle-brightness.sh restore
}

# turn off keyboard backlight.
listener {
    timeout = 150                                               # 2.5min.
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd platform::kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && $HOME/.config/hypr/scripts/idle-brightness.sh restore
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
