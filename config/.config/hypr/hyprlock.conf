# Two-column card lockscreen (adapted from Hyprlock-Dots layout20),
# Everforest Dark Hard. Assets live outside the repo:
#   ~/.local/state/hypr/lock-wallpaper.jpg  - dedicated lock wallpaper
#   ~/.local/state/hypr/profile.png         - avatar (replace to use a photo)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/state/hypr/lock-wallpaper.jpg
    blur_passes = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0

    color = rgba(2D353Bff)
}

# --- LEFT COLUMN ---

# Login card
shape {
    monitor =
    size = 360, 380
    color = rgba(15, 18, 20, 0.45)
    rounding = 25
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:600000] uname -n
    color = rgba(859289ff)
    font_size = 13
    font_family = Geist
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

# Time-based greeting
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ "$h" -lt 12 ]; then echo "Good morning"; elif [ "$h" -lt 17 ]; then echo "Good afternoon"; else echo "Good evening"; fi
    color = rgba(D3C6AAff)
    font_size = 32
    font_family = Geist
    position = -200, 240
    halign = center
    valign = center
    zindex = 2
}

# Username pill
shape {
    monitor =
    size = 320, 70
    color = rgba(A7C080ff)
    rounding = 20
    position = -200, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:600000] echo "<b>$USER</b>"
    color = rgba(2D353Bff)
    font_size = 18
    font_family = Geist
    position = -200, 130
    halign = center
    valign = center
    zindex = 3
}

# Password pill
input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(A7C080ff)
    font_color = rgba(2D353Bff)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    hide_input = false
    rounding = 20

    check_color = rgba(DBBC7Fff)
    fail_color = rgba(E67E80ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(E69875ff)

    position = -200, 40
    halign = center
    valign = center
    zindex = 2
}

# Clock card
shape {
    monitor =
    size = 360, 160
    color = rgba(15, 18, 20, 0.45)
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = rgba(D3C6AAff)
    font_size = 72
    font_family = Geist
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:30000] uptime -p | sed -e 's/up / 󰔚 UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = rgba(859289ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -260, -195
    halign = center
    valign = center
    zindex = 2
}

# --- RIGHT COLUMN ---

# Profile card
shape {
    monitor =
    size = 360, 380
    color = rgba(15, 18, 20, 0.45)
    rounding = 25
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = ~/.local/state/hypr/profile.png
    size = 120
    rounding = 60
    border_size = 3
    border_color = rgba(A7C080ff)
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>"
    color = rgba(D3C6AAff)
    font_size = 38
    font_family = Geist
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%d %B, %Y"
    color = rgba(859289ff)
    font_size = 14
    font_family = Geist
    position = 200, 100
    halign = center
    valign = center
    zindex = 11
}

# Status / media card
shape {
    monitor =
    size = 360, 320
    color = rgba(35, 42, 46, 0.85)
    rounding = 25
    position = 200, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
    zindex = 10
}

# Media info
label {
    monitor =
    text = cmd[update:1000] player=$(playerctl -l 2>/dev/null | head -n 1); if [ "$player" = "spotify" ]; then echo " <b></b> "; else echo " 󰎇 "; fi
    color = rgba(D3C6AAff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 200, -10
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] title=$(playerctl metadata xesam:title 2>/dev/null | cut -c1-24); if [ -z "$title" ]; then echo "No Music Playing"; else echo "$title"; fi
    color = rgba(D3C6AAff)
    font_size = 14
    font_family = Geist
    position = 200, -40
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] artist=$(playerctl metadata xesam:artist 2>/dev/null | cut -c1-30); if [ -z "$artist" ]; then echo ""; else echo "$artist"; fi
    color = rgba(859289ff)
    font_size = 12
    font_family = Geist
    position = 200, -60
    halign = center
    valign = center
    zindex = 11
}

# Wifi button (subtle card; aqua only when connected)
shape {
    monitor =
    size = 150, 75
    color = rgba(58, 69, 74, 0.9)
    rounding = 20
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:5000] if nmcli -t -f active dev wifi 2>/dev/null | grep -q '^yes'; then echo "<span foreground='##7FBBB3'> 󰖩 </span>"; else echo "<span foreground='##859289'> 󰖪 </span>"; fi
    color = rgba(859289ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 115, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:5000] wifi=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2}' | head -n 1 | cut -c1-14); if [ -n "$wifi" ]; then echo "<span foreground='##7FBBB3'>$wifi</span>"; else echo "<span foreground='##859289'>Disconnected</span>"; fi
    color = rgba(859289ff)
    font_size = 10
    font_family = Geist
    position = 115, -145
    halign = center
    valign = center
    zindex = 12
}

# Bluetooth button (subtle card; aqua only when connected)
shape {
    monitor =
    size = 150, 75
    color = rgba(58, 69, 74, 0.9)
    rounding = 20
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:5000] if bluetoothctl info 2>/dev/null | grep -q "Name:"; then echo "<span foreground='##7FBBB3'> 󰂯 </span>"; else echo "<span foreground='##859289'> 󰂲 </span>"; fi
    color = rgba(859289ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 285, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:5000] bt=$(bluetoothctl info 2>/dev/null | grep "Name:" | cut -d ' ' -f 2- | cut -c 1-14); if [ -n "$bt" ]; then echo "<span foreground='##7FBBB3'>$bt</span>"; else echo "<span foreground='##859289'>Disconnected</span>"; fi
    color = rgba(859289ff)
    font_size = 10
    font_family = Geist
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}

# Battery card (percentage colored by charge level)
shape {
    monitor =
    size = 320, 100
    color = rgba(58, 69, 74, 0.9)
    rounding = 25
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:10000] cap=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null); if [ "$cap" -gt 50 ]; then c=A7C080; elif [ "$cap" -gt 20 ]; then c=DBBC7F; else c=E67E80; fi; echo "<span foreground='##${c}'><b>${cap}%</b></span>"
    color = rgba(D3C6AAff)
    font_size = 30
    font_family = Geist
    position = 200, -222
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:10000] s=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); case "$s" in Charging) echo " 󰂄 Charging";; Full) echo " 󰁹 Full";; *) echo " 󰁹 $s";; esac
    color = rgba(859289ff)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 200, -262
    halign = center
    valign = center
    zindex = 12
}
