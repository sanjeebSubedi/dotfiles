general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot   # Takes a screenshot of current screen as background
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7    # Dim the background
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    
    color = rgba(2D353Bff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(D3C6AAff)    # Everforest fg
    font_size = 120
    font_family = SF Pro Display
    
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(A7C080ff)    # Everforest green
    font_size = 24
    font_family = SF Pro Display
    
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = rgba(7FBBB3ff)    # Everforest aqua/teal
    font_size = 20
    font_family = SF Pro Display
    
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    
    # Everforest colors
    outer_color = rgba(7FBBB3ff)        
    inner_color = rgba(3A454Aff)       
    font_color = rgba(D3C6AAff)         
    
    fade_on_empty = false
    fade_timeout = 1000
    
    placeholder_text = *****
    hide_input = false
    rounding = 10
    
    check_color = rgba(A7C080ff)        
    fail_color = rgba(E67E80ff)         
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    
    capslock_color = rgba(DBBC7Fff)     # Yellow for caps lock
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    
    position = 0, -200
    halign = center
    valign = center
}
